[project]
name = "film-studio-os"
version = "0.4.0"
description = "Provider-neutral, rights-aware, quality-gated film production orchestration for IBM Bob and CLI/MCP"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
ingest = ["pypdf>=5,<7"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
film-studio = "film_studio_os.cli:main"

[tool.setuptools.packages.find]
include = ["film_studio_os*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
